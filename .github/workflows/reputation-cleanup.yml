name: AURA reputation cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reputation-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove remaining academic implication
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text().replace('Repository files in scholarly reading order','Repository files in recommended reading order')
          p.write_text(s)
          PY
      - name: Commit cleanup
        run: |
          git config user.name "Joe Nasr Reputation Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Finish AURA terminology cleanup"
          git push
